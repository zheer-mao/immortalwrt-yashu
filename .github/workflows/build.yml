# GitHub Actions 编译 ImmortalWrt（亚瑟 AX1800 Pro）——磁盘修复版
# 用法：把本文件内容覆盖仓库里的 .github/workflows/build.yml（网页上编辑该文件、粘贴、提交到 main）
# 改动说明：原版在“装依赖”那一步 apt update 就报 No space left on device。
# 本版在清理前后都加 df -h（下次失败时一眼能看到还剩多少），并在 maximize-build-space
# 之后再手动删一批 runner 自带的大件（swift/julia/chromium/hostedtoolcache/docker 镜像），
# 再把 apt 换成脚本里更稳的 apt-get。
# 另修 Load custom config：用 $GITHUB_WORKSPACE 绝对路径取 .config，不再依赖当前目录；
# 并在 Checkout 后加 Verify checkout 步骤，下次如果 .config 没检出来，第一时间就能看到。
# 关键修复（2026-10-25 实测定位）：easimon/maximize-build-space 会把一个新卷挂载到
# $GITHUB_WORKSPACE 上，挂载后之前检出的文件会被盖住、访问不到——官方 README 明确要求
# 它必须作为第一步、在 actions/checkout 之前跑。原版先 Checkout 再清理，正是 .config
# “消失”的原因。同时把 root-reserve-mb 从 2048 提到 8192，给 apt 留足根分区空间
# （apt 装包走根分区，留太少会重现 No space left on device）。

name: Build ImmortalWrt for 亚瑟 AX1800 Pro

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout
        run: |
          pwd
          ls -la
          test -f .config && echo ".config OK" || echo ".config MISSING"

      - name: Check disk space
        run: df -h

      - name: Extra cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/share/swift /usr/local/julia* /usr/local/share/chromium \
            /home/runner/.rustup /home/runner/.cargo
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget curl ccache

      - name: Clone source code
        run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH immortalwrt

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          cp "$GITHUB_WORKSPACE/.config" immortalwrt/.config
          cd immortalwrt && make defconfig

      - name: Download packages
        working-directory: immortalwrt
        run: make download -j8

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-jdcloud_re-ss-01
          path: immortalwrt/bin/targets/qualcommax/ipq60xx/
