# GitHub Actions 编译 ImmortalWrt（亚瑟 AX1800 Pro）
# 用法：把本文件放进仓库的 .github/workflows/ 目录，改名为 build.yml
# 然后在仓库 Actions 页面点 Run workflow，跑完在 Artifacts 里下载固件

name: Build ImmortalWrt for 亚瑟 AX1800 Pro

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget curl ccache

      - name: Clone source code
        run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH immortalwrt

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          cp $CONFIG_FILE immortalwrt/.config
          cd immortalwrt && make defconfig

      - name: Download packages
        working-directory: immortalwrt
        run: make download -j8

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-jdcloud_re-ss-01
          path: immortalwrt/bin/targets/qualcommax/ipq60xx/
