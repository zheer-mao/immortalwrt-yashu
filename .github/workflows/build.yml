# GitHub Actions 编译 ImmortalWrt（亚瑟 AX1800 Pro）——磁盘修复版
# 用法：把本文件内容覆盖仓库里的 .github/workflows/build.yml（网页上编辑该文件、粘贴、提交到 main）
# 改动说明：原版在“装依赖”那一步 apt update 就报 No space left on device。
# 本版在清理前后都加 df -h（下次失败时一眼能看到还剩多少），并在 maximize-build-space
# 之后再手动删一批 runner 自带的大件（swift/julia/chromium/hostedtoolcache/docker 镜像），
# 再把 apt 换成脚本里更稳的 apt-get。

name: Build ImmortalWrt for 亚瑟 AX1800 Pro

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check disk space (before cleanup)
        run: df -h

      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Extra cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/share/swift /usr/local/julia* /usr/local/share/chromium \
            /home/runner/.rustup /home/runner/.cargo
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget curl ccache

      - name: Clone source code
        run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH immortalwrt

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          cp $CONFIG_FILE immortalwrt/.config
          cd immortalwrt && make defconfig

      - name: Download packages
        working-directory: immortalwrt
        run: make download -j8

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-jdcloud_re-ss-01
          path: immortalwrt/bin/targets/qualcommax/ipq60xx/
